<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c1a47;
            background-image: url('https://www.transparenttextures.com/patterns/anchors-away.png');
            text-align: center;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .bookmark-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .bookmark {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 250px;
            max-width: 300px;
        }

        .bookmark a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .bookmark i {
            cursor: pointer;
            margin-left: 10px;
            color: red;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        .modal h3 {
            background: purple;
            color: white;
            padding: 10px;
            margin: -20px -20px 10px -20px;
            border-radius: 10px 10px 0 0;
        }

        .modal input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .modal button {
            background: purple;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>Bookmark Manager</h2>
    <button onclick="openModal()">Add Bookmark</button>

    <div class="bookmark-container" id="bookmarkList"></div>

    <div id="modal" class="modal">
        <h3>Add Bookmark <span class="close-btn" onclick="closeModal()">&times;</span></h3>
        <input type="text" id="websiteName" placeholder="Website Name">
        <input type="url" id="websiteURL" placeholder="Website URL">
        <button onclick="saveBookmark()">Save</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadBookmarks);

        function openModal() {
            document.getElementById("modal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        function saveBookmark() {
            let name = document.getElementById("websiteName").value;
            let url = document.getElementById("websiteURL").value;

            if (name === "" || url === "") {
                alert("Please submit values for both fields");
                return;
            }

            let bookmark = { name, url };
            let bookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];
            bookmarks.push(bookmark);
            localStorage.setItem("bookmarks", JSON.stringify(bookmarks));

            closeModal();
            loadBookmarks();
        }

        function loadBookmarks() {
            let bookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];
            let container = document.getElementById("bookmarkList");
            container.innerHTML = "";

            bookmarks.forEach((bookmark, index) => {
                let div = document.createElement("div");
                div.classList.add("bookmark");

                div.innerHTML = `
                    <a href="${bookmark.url}" target="_blank">${bookmark.name}</a>
                    <i class="fa fa-times" onclick="deleteBookmark(${index})"></i>
                `;

                container.appendChild(div);
            });
        }

        function deleteBookmark(index) {
            let bookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];
            bookmarks.splice(index, 1);
            localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
            loadBookmarks();
        }
    </script>

</body>
</html>
