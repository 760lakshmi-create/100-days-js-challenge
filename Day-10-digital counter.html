<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Auto Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
        }
        .counter-container {
            position: relative;
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }
        .counter-box {
            width: 100px;
            height: 100px;
            background: #ff4b4b;
            color: white;
            font-size: 35px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(255, 75, 75, 0.4);
            transition: transform 0.2s ease-in-out;
            margin: 10px auto;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .arrow, .button {
            font-size: 18px;
            color: white;
            background: #ff4b4b;
            border: none;
            padding: 12px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0px 3px 10px rgba(255, 75, 75, 0.4);
            transition: 0.3s;
        }
        .arrow:hover, .button:hover {
            background: #e63e3e;
        }
    </style>
</head>
<body>
    <h1>Digital Counter</h1>
    <div class="counter-container">
        <button class="arrow" onclick="increment()">&#9650;</button>
        <div class="counter-box" id="counter">0</div>
        <button class="arrow" onclick="decrement()">&#9660;</button>
    </div>
    <div class="button-container">
        <button class="button" onclick="startAuto()">Start</button>
        <button class="button" onclick="stopAuto()">Stop</button>
    </div>
    
    <script>
        let count = 0;
        let interval;
        const counterElement = document.getElementById("counter");
        
        function updateCounter() {
            counterElement.textContent = count;
        }
        function increment() {
            count++;
            updateCounter();
        }
        function decrement() {
            count--;
            updateCounter();
        }
        function startAuto() {
            if (!interval) {
                interval = setInterval(() => {
                    increment();
                }, 1000);
            }
        }
        function stopAuto() {
            clearInterval(interval);
            interval = null;
        }
    </script>
</body>
</html>
