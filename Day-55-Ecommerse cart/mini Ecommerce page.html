<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-commerce Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #d0f4de, #fef9ef, #e4c1f9);
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 2.8rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    .products-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 50px;
      width: 100%;
      max-width: 1200px;
    }
    .product {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .product:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid #eee;
    }
    .product h3 {
      margin: 15px 0 5px;
      font-size: 20px;
      color: #333;
    }
    .product p {
      color: #ff4081;
      font-weight: bold;
      font-size: 16px;
    }
    .product button {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: #fff;
      padding: 10px;
      width: 100%;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: background 0.3s ease;
    }
    .product button:hover {
      background: linear-gradient(to right, #0072ff, #00c6ff);
    }

    .cart {
      width: 100%;
      max-width: 700px;
      background: #f0faff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .cart h2 {
      color: #0288d1;
      margin-bottom: 20px;
      text-align: center;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #b3e5fc;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 12px;
    }
    .cart-item span {
      font-size: 16px;
      color: #01579b;
    }
    .cart-item button {
      background: #ff5252;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .cart-item button:hover {
      background: #d32f2f;
    }
    .total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
      color: #263238;
    }
    .checkout {
      margin-top: 25px;
      text-align: right;
    }
    .checkout button {
      background: #00bfa5;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .checkout button:hover {
      background: #008e76;
    }
  </style>
</head>
<body>
  <h1>🛍️ E-commerce Shop</h1>
  <div class="products-container">
    <div class="product" data-name="T-shirt 👕" data-price="499">
      <img src="img2.jpg" alt="T-shirt">
      <h3>Cool T-shirt</h3>
      <p>₹499</p>
      <button onclick="addToCart(this)">Add to Cart</button>
    </div>
    <div class="product" data-name="Shoes 👟" data-price="999">
      <img src="c:\Users\laksh\OneDrive\Documents\up\100-days-js-challenge\Day-55-Ecommerse cart\img1.webp" alt="Shoes">
      <h3>Running Shoes</h3>
      <p>₹999</p>
      <button onclick="addToCart(this)">Add to Cart</button>
    </div>
    <div class="product" data-name="Headphones 🎧" data-price="799">
      <img src="c:\Users\laksh\OneDrive\Documents\up\100-days-js-challenge\Day-55-Ecommerse cart\img3.jpg" alt="Headphones">
      <h3>Wireless Headphones</h3>
      <p>₹799</p>
      <button onclick="addToCart(this)">Add to Cart</button>
    </div>
    <div class="product" data-name="Backpack 🎒" data-price="649">
      <img src="c:\Users\laksh\OneDrive\Documents\up\100-days-js-challenge\Day-55-Ecommerse cart\img4.jpg" alt="Backpack">
      <h3>Stylish Backpack</h3>
      <p>₹649</p>
      <button onclick="addToCart(this)">Add to Cart</button>
    </div>
  </div>
  <div class="cart">
    <h2>🛒 Your Cart</h2>
    <div id="cart-items"></div>
    <div class="total">Total: ₹<span id="total">0</span></div>
    <div class="checkout">
      <button onclick="checkout()">Proceed to Checkout</button>
    </div>
  </div>
  <script>
    const cartItemsContainer = document.getElementById('cart-items');
    const totalElement = document.getElementById('total');
    let cart = [];

    function addToCart(button) {
      const product = button.parentElement;
      const name = product.dataset.name;
      const price = parseInt(product.dataset.price);

      const existingItem = cart.find(item => item.name === name);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ name, price, quantity: 1 });
      }

      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      cartItemsContainer.innerHTML = '';
      let total = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <span>${item.name} x ${item.quantity} - ₹${itemTotal}</span>
          <button onclick="removeItem(${index})">Remove</button>
        `;
        cartItemsContainer.appendChild(div);
      });

      totalElement.textContent = total;
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      let message = "Thank you for shopping with us!\n\nOrder Summary:\n";
      cart.forEach(item => {
        message += `${item.name} x ${item.quantity} - ₹${item.price * item.quantity}\n`;
      });
      message += `\nTotal: ₹${totalElement.textContent}`;
      alert(message);
      cart = [];
      renderCart();
    }
  </script>
</body>
</html>
