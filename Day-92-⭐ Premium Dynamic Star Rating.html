<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Dynamic Star Rating</title>
<style>
  body {
    background: #0f172a;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }

  h2 {
    margin-bottom: 15px;
  }

  .rating-container {
    display: flex;
    gap: 8px;
    align-items: center;
    user-select: none;
    position: relative;
  }

  .star {
    font-size: 50px;
    color: #555;
    cursor: pointer;
    transition: transform 0.25s ease, color 0.25s ease, text-shadow 0.3s ease;
  }

  .star.full {
    color: gold;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
  }

  .star.half {
    background: linear-gradient(90deg, gold 50%, #555 50%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
  }

  .star.clicked {
    animation: bounce 0.4s ease;
  }

  @keyframes bounce {
    0% { transform: scale(1.3); }
    50% { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  .rating-value {
    margin-top: 15px;
    font-size: 18px;
    color: #9ca3af;
  }

  .reset-btn {
    margin-top: 12px;
    background: linear-gradient(90deg, #f87171, #ef4444);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    transition: 0.3s ease;
  }

  .reset-btn:hover {
    background: linear-gradient(90deg, #ef4444, #dc2626);
  }
</style>
</head>
<body>

<h2>⭐ Premium Dynamic Star Rating</h2>

<div class="rating-container" id="starRating"></div>
<div class="rating-value" id="ratingValue">Your rating: 0/5</div>
<button class="reset-btn" id="resetBtn">Reset</button>

<script>
  const starContainer = document.getElementById("starRating");
  const ratingValue = document.getElementById("ratingValue");
  const resetBtn = document.getElementById("resetBtn");

  const totalStars = 5;
  let selectedRating = parseFloat(localStorage.getItem("userRating")) || 0;

  // Create stars
  for (let i = 1; i <= totalStars; i++) {
    const star = document.createElement("span");
    star.innerHTML = "★";
    star.classList.add("star");
    star.dataset.value = i;
    starContainer.appendChild(star);
  }

  // Highlight stars
  function highlightStars(rating) {
    const stars = document.querySelectorAll(".star");
    stars.forEach((star, index) => {
      star.classList.remove("full", "half");
      if (rating >= index + 1) {
        star.classList.add("full");
      } else if (rating >= index + 0.5) {
        star.classList.add("half");
      }
    });
  }

  // Set rating
  starContainer.addEventListener("mousemove", e => {
    const rect = starContainer.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    const hoverRating = Math.round(percent * totalStars * 2) / 2;
    highlightStars(hoverRating);
  });

  starContainer.addEventListener("mouseleave", () => {
    highlightStars(selectedRating);
  });

  starContainer.addEventListener("click", e => {
    const rect = starContainer.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    selectedRating = Math.round(percent * totalStars * 2) / 2;
    localStorage.setItem("userRating", selectedRating);
    ratingValue.textContent = `Your rating: ${selectedRating}/${totalStars}`;
    highlightStars(selectedRating);

    // Click animation
    e.target.classList.add("clicked");
    setTimeout(() => e.target.classList.remove("clicked"), 400);
  });

  // Reset rating
  resetBtn.addEventListener("click", () => {
    selectedRating = 0;
    localStorage.removeItem("userRating");
    ratingValue.textContent = `Your rating: 0/${totalStars}`;
    highlightStars(0);
  });

  // Initialize
  ratingValue.textContent =` Your rating: ${selectedRating}/${totalStars}`;
  highlightStars(selectedRating);
</script>

</body>
</html>
