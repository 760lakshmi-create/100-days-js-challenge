<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 400px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #444;
        }

        .translator-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            transition: all 0.3s ease-in-out;
        }

        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.5);
            outline: none;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ddd;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #667eea;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        button:hover {
            background: #5643cc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌍 Language Translator</h2>

        <div class="translator-box">
            <textarea id="inputText" placeholder="Enter text..."></textarea>

            <select id="fromLang">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="hi">Hindi</option>
                <option value="zh">Chinese</option>
            </select>

            <button id="translateBtn">Translate</button>

            <select id="toLang">
                <option value="es">Spanish</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="hi">tamil</option>
                <option value="zh">Chinese</option>
            </select>

            <textarea id="outputText" placeholder="Translation..." readonly></textarea>
            <button id="copyBtn">Copy</button>
        </div>
    </div>

    <script>
        document.getElementById("translateBtn").addEventListener("click", function () {
            let text = document.getElementById("inputText").value;
            let fromLang = document.getElementById("fromLang").value;
            let toLang = document.getElementById("toLang").value;

            if (text.trim() === "") {
                alert("Please enter text to translate!");
                return;
            }

            let url = `https://api.mymemory.translated.net/get?q=${encodeURI(text)}&langpair=${fromLang}|${toLang}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("outputText").value = data.responseData.translatedText;
                })
                .catch(error => console.error("Error:", error));
        });

        document.getElementById("copyBtn").addEventListener("click", function () {
            let outputText = document.getElementById("outputText");
            outputText.select();
            document.execCommand("copy");
            alert("Text copied!");
        });
    </script>

</body>
</html>
