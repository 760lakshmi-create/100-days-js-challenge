<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enhanced Bubbbble Hover Text</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      color: #fff;
    }

    .bubble-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      padding: 25px 50px;
      border-radius: 15px;
      font-size: 2.8rem;
      display: flex;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .bubble-char {
      color: #888;
      transition: 
        transform 0.3s ease, 
        color 0.3s ease, 
        text-shadow 0.3s ease,
        filter 0.3s ease;
      position: relative;
      cursor: default;
    }

    .bubble-char.active {
      color: #ffffff;
      font-weight: bold;
      transform: scale(1.3);
      filter: brightness(1.5);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .bubble-char.gradient {
      background: linear-gradient(45deg, #ff6ec4, #7873f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

  <h1>✨ Animated Text</h1>
  <div class="bubble-container" id="bubbleText">
    <!-- Characters will be generated by JS -->
  </div>

  <script>
    const text = "Bubbbble text";
    const container = document.getElementById("bubbleText");

    // Create spans for each character
    text.split('').forEach(char => {
      const span = document.createElement("span");
      span.textContent = char;
      span.classList.add("bubble-char");
      container.appendChild(span);
    });

    const spans = document.querySelectorAll(".bubble-char");

    spans.forEach((span, i) => {
      span.addEventListener("mouseenter", () => {
        spans.forEach(s => s.classList.remove("active", "gradient"));

        // Animate hovered and nearby letters
        for (let offset = -2; offset <= 2; offset++) {
          const idx = i + offset;
          if (spans[idx]) {
            spans[idx].classList.add("active");

            // Gradient only to center 3
            if (Math.abs(offset) <= 1) {
              spans[idx].classList.add("gradient");
            }
          }
        }
      });

      // Clear on mouse leave (optional for persistent effect)
      span.addEventListener("mouseleave", () => {
        spans.forEach(s => s.classList.remove("active", "gradient"));
      });
    });
  </script>

</body>
</html>
