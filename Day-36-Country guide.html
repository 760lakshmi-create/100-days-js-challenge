<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fad0c4, #a18cd1);
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 400px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: gray;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 15px 0;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            background: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s ease;
        }

        button:hover {
            background: #0056b3;
        }

        .country-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(227, 222, 222, 0.396);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }

        img {
            width: 100px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .info {
            text-align: left;
            font-size: 15px;
            line-height: 1.6;
        }

        .info strong {
            color: black;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Country Facts Generator</h2>
        <p>Search for the country you want to know about.</p>

        <div class="search-box">
            <input type="text" id="countryInput" placeholder="Enter country name...">
            <button onclick="fetchCountry()">Search</button>
        </div>

        <p id="error" class="error"></p>

        <div id="countryInfo" class="country-info">
            <img id="flag" src="" alt="Country Flag">
            <h3 id="countryName"></h3>
            <div class="info">
                <p><strong>Capital:</strong> <span id="capital"></span></p>
                <p><strong>Continent:</strong> <span id="continent"></span></p>
                <p><strong>Population:</strong> <span id="population"></span></p>
                <p><strong>Currency:</strong> <span id="currency"></span></p>
                <p><strong>Common Languages:</strong> <span id="languages"></span></p>
            </div>
        </div>
    </div>

    <script>
        function fetchCountry() {
            const countryName = document.getElementById("countryInput").value.trim();
            const countryInfo = document.getElementById("countryInfo");
            const errorDiv = document.getElementById("error");

            if (countryName === "") {
                errorDiv.textContent = "⚠️ Please enter a valid country name!";
                countryInfo.style.display = "none";
                return;
            }

            fetch(`https://restcountries.com/v3.1/name/${countryName}?fullText=true`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 404) {
                        errorDiv.textContent = "❌ Country not found!";
                        countryInfo.style.display = "none";
                        return;
                    }

                    errorDiv.textContent = "";
                    const country = data[0];

                    document.getElementById("flag").src = country.flags.svg;
                    document.getElementById("countryName").textContent = country.name.common;
                    document.getElementById("capital").textContent = country.capital ? country.capital[0] : "N/A";
                    document.getElementById("continent").textContent = country.continents[0];
                    document.getElementById("population").textContent = country.population.toLocaleString();
                    document.getElementById("currency").textContent = Object.values(country.currencies)[0].name + " - " + Object.keys(country.currencies)[0];
                    document.getElementById("languages").textContent = Object.values(country.languages).join(", ");

                    countryInfo.style.display = "block";
                })
                .catch(() => {
                    errorDiv.textContent = "⚠️ Error fetching data. Try again!";
                    countryInfo.style.display = "none";
                });
        }
    </script>

</body>
</html>
