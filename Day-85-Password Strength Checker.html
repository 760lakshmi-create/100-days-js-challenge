<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Strength Checker</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      width: 350px;
      text-align: center;
      color: white;
      position: relative;
      z-index: 10;
    }

    h2 {
      margin-bottom: 20px;
      color: #00fff0;
      text-shadow: 0 0 10px #00fff0;
    }

    .input-group {
      position: relative;
      margin: 20px 0;
    }

    .input-group input {
      width: 100%;
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      background: rgba(255,255,255,0.1);
      color: white;
      transition: 0.3s ease;
    }

    .strength-meter {
      height: 10px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .feedback {
      margin-top: 10px;
      font-weight: bold;
      font-size: 15px;
      text-shadow: 0 0 3px black;
    }

    .weak { background: red; }
    .medium { background: orange; }
    .strong { background: limegreen; }

    /* Background Bubbles */
    .bubbles {
      position: absolute;
      top: 0; left: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .bubbles span {
      position: absolute;
      display: block;
      width: 20px; height: 20px;
      background: rgba(0,255,255,0.2);
      animation: rise 20s linear infinite;
      bottom: -150px;
      border-radius: 50%;
    }

    .bubbles span:nth-child(odd) {
      background: rgba(0,255,255,0.3);
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
      }
      100% {
        transform: translateY(-1200px) scale(0.3);
      }
    }

  </style>
</head>
<body>

  <div class="bubbles">
    <!-- Random bubbles -->
    <span style="left: 10%; animation-duration: 15s;"></span>
    <span style="left: 20%; animation-duration: 20s;"></span>
    <span style="left: 30%; animation-duration: 17s;"></span>
    <span style="left: 50%; animation-duration: 22s;"></span>
    <span style="left: 60%; animation-duration: 19s;"></span>
    <span style="left: 80%; animation-duration: 24s;"></span>
    <span style="left: 90%; animation-duration: 18s;"></span>
  </div>

  <div class="container">
    <h2>Password Strength Checker</h2>
    <div class="input-group">
      <input type="password" id="password" placeholder="Enter password" />
      <div class="strength-meter">
        <div id="strength-bar" class="strength-bar"></div>
      </div>
      <div class="feedback" id="feedback">Enter a password</div>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById("password");
    const strengthBar = document.getElementById("strength-bar");
    const feedback = document.getElementById("feedback");

    passwordInput.addEventListener("input", () => {
      const password = passwordInput.value;
      let strength = 0;

      if (password.length > 5) strength++;
      if (password.match(/[A-Z]/)) strength++;
      if (password.match(/[0-9]/)) strength++;
      if (password.match(/[^a-zA-Z0-9]/)) strength++;

      updateStrengthMeter(strength);
    });

    function updateStrengthMeter(strength) {
      let width = strength * 25;
      strengthBar.style.width = width + "%";

      strengthBar.className = "strength-bar";

      if (strength === 0) {
        feedback.textContent = "Enter a password";
      } else if (strength === 1) {
        strengthBar.classList.add("weak");
        feedback.textContent = "Weak 🔴";
      } else if (strength === 2 || strength === 3) {
        strengthBar.classList.add("medium");
        feedback.textContent = "Medium 🟠";
      } else if (strength === 4) {
        strengthBar.classList.add("strong");
        feedback.textContent = "Strong 🟢";
      }
    }
  </script>
</body>
</html>
