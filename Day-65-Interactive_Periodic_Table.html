<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advanced Interactive Periodic Table</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

  body {
    margin: 0;
    background: #121212;
    color: #eee;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    margin-bottom: 10px;
    color: #00d8ff;
    text-shadow: 0 0 5px #00d8ff;
  }

  #search-box {
    margin-bottom: 20px;
    width: 300px;
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #222;
    color: #eee;
    box-shadow: 0 0 10px #00d8ff33;
    transition: box-shadow 0.3s ease;
  }
  #search-box:focus {
    box-shadow: 0 0 20px #00d8ffaa;
  }

  #periodic-table {
    display: grid;
    grid-template-columns: repeat(18, 60px);
    grid-auto-rows: 75px;
    gap: 8px;
    max-width: 1140px;
    width: 100%;
  }

  .element {
    background: #222;
    border-radius: 10px;
    box-shadow: inset 0 0 5px #111;
    cursor: pointer;
    color: #eee;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    user-select: none;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    position: relative;
  }

  .element:hover {
    transform: scale(1.15);
    box-shadow: 0 0 19px #00d8ff;
    z-index: 10;
    
  }

  .number {
    font-size: 12px;
    opacity: 0.6;
    position: absolute;
    top: 5px;
    left: 8px;
    font-weight: 700;
  }

  .symbol {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .name {
    font-size: 10px;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.04em;
  }

  /* Color coding by group */
  .alkali { background: #ff6659; }       /* Group 1 */
  .alkaline-earth { background: #ff9f59; } /* Group 2 */
  .transition { background: #e1085f; color: #222; } /* Groups 3-12 */
  .post-transition { background: #25dc3b; color: #222; } /* Groups 13-16 */
  .metalloid { background: #7e57c2; }
  .nonmetal { background: #81d4fa; color: #222; }
  .halogen { background: #ffca28; color: #222; }
  .noble-gas { background: #448aff; }
  .lanthanide { background: #ff80ab; color: #222; }
  .actinide { background: #ea80fc; color: #222; }
  .act{background: #1ce2c8; color: #222; }

  /* Legend */
  #legend {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    max-width: 1140px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .legend-color {
    width: 20px;
    height: 20px;
    border-radius: 5px;
  }
  .alkali.legend-color { background: #ff6659; }
  .alkaline-earth.legend-color { background: #ff9f59; }
  .transition.legend-color { background: #b00446; }
  .post-transition.legend-color { background: #69f0ae; }
  .metalloid.legend-color { background: #7e57c2; }
  .nonmetal.legend-color { background: #81d4fa; }
  .halogen.legend-color { background: #ffca28; }
  .noble-gas.legend-color { background: #f9e69d; }
  .lanthanide.legend-color { background: #ff80ab; }
  .actinide.legend-color { background: #ea80fc; }
  .ab{background-color: #bb0743;}

  /* Modal */
  #modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(18, 18, 18, 0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 100;
  }
  #modal.visible {
    visibility: visible;
    opacity: 1;
  }
  #modal-content {
    background: #222;
    padding: 25px 30px;
    border-radius: 15px;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 0 20px #00d8ffaa;
    position: relative;
    color: #eee;
    font-size: 16px;
    line-height: 1.4;
  }
  #modal-close {
    position: absolute;
    top: 12px;
    right: 15px;
    font-size: 22px;
    cursor: pointer;
    color: #00d8ff;
    font-weight: 700;
  }
  #modal-close:hover {
    color: #00b0ff;
  }
</style>

  const modal = document.getElementById("modal");
  const modalBody = document.getElementById("modal-body");
  const modalClose = document.getElementById("modal-close");

  // Position map: standard periodic table positions (group = column, period = row)
  // For demonstration, a simple layout: fill by group and period, fallback for nulls
  function getGridPosition(el) {
    // Handle lanthanides and actinides placed below (period 8 and 9)
    if (el.period === 8) return { row: 8, col: el.number - 56 }; // lanthanides from 57 onwards
    if (el.period === 9) return { row: 9, col: el.number - 88 }; // actinides from 89 onwards
    if (el.group) return { row: el.period, col: el.group };
    // fallback: place on last row and approximate col
    return { row: el.period || 10, col: el.group || (el.number % 18) + 1 };
  }

  function createElementBox(el) {
    const box = document.createElement("div");
    box.classList.add("element");
    if(el.category) box.classList.add(el.category);

    const pos = getGridPosition(el);
    box.style.gridRow = pos.row;
    box.style.gridColumn = pos.col;

    box.innerHTML = `
      <div class="number">${el.number}</div>
      <div class="symbol">${el.symbol}</div>
      <div class="name">${el.name}</div>
    `;

    // Show modal on click
    box.addEventListener("click", () => {
      modalBody.innerHTML = `
        <h2>${el.name} (${el.symbol})</h2>
        <p><strong>Atomic Number:</strong> ${el.number}</p>
        <p><strong>Atomic Weight:</strong> ${el.weight}</p>
        <p>${el.description}</p>
      `;
      modal.classList.add("visible");
    });

    return box;
  }

  function renderTable(filterText = "") {
    table.innerHTML = "";
    const filtered = elements.filter(el => {
      const term = filterText.toLowerCase();
      return (
        el.name.toLowerCase().includes(term) ||
        el.symbol.toLowerCase().includes(term) ||
        String(el.number).includes(term)
      );
    });
    filtered.forEach(el => {
      table.appendChild(createElementBox(el));
    });
  }

  searchBox.addEventListener("input", (e) => {
    renderTable(e.target.value);
  });

  modalClose.addEventListener("click", () => {
    modal.classList.remove("visible");
  });
  modal.addEventListener("click", (e) => {
    if(e.target === modal) modal.classList.remove("visible");
  });

  renderTable();

</script>
