<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Choice Picker</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            color: black;
        }
        textarea {
            width: 90%;
            height: 100px;
            padding: 10px;
            border: 2px solid #764ba2;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 16px;
            resize: none;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 18px;
            transition: background 0.3s;
        }
        button:hover {
            background: #ff4757;
        }
        .choices {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .choice {
            background: #dcdde1;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            transition: transform 0.3s, background 0.3s;
        }
        .highlight {
            background: #5f0742;
            color: white;
            transform: scale(1.1);
        }
        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎲 Random Choice Picker</h2>
        <textarea id="choices" placeholder="Enter choices separated by commas..."></textarea>
        <button onclick="pickRandomChoice()">Pick Random Choice</button>
        <div class="choices" id="choiceContainer"></div>
        <h3 id="result"></h3>
    </div>
    
    <script>
        function pickRandomChoice() {
            const textarea = document.getElementById('choices');
            const choiceContainer = document.getElementById('choiceContainer');
            const result = document.getElementById('result');
            
            const choices = textarea.value.split(',').map(choice => choice.trim()).filter(choice => choice !== "");
            choiceContainer.innerHTML = "";
            result.textContent = "";
            
            if (choices.length === 0) {
                alert("Please enter some choices!");
                return;
            }
            
            choices.forEach(choice => {
                const span = document.createElement('span');
                span.classList.add('choice');
                span.textContent = choice;
                choiceContainer.appendChild(span);
            });
            
            setTimeout(() => {
                const allChoices = document.querySelectorAll('.choice');
                const randomIndex = Math.floor(Math.random() * allChoices.length);
                allChoices.forEach(choice => choice.classList.remove('highlight'));
                allChoices[randomIndex].classList.add('highlight');
                result.textContent = `🎉 Selected Choice: ${allChoices[randomIndex].textContent}`;
            }, 1000);
        }
    </script>
</body>
</html>
