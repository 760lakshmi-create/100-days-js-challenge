<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Dynamic Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      min-height: 100vh;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 50px 20px;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: rgba(255, 255, 255, 0.932);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      animation: fadeIn 1s ease-out;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(to right, #30CFD0 0%, #330867 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    form textarea {
      grid-column: span 2;
    }

    input, textarea {
      padding: 15px;
      border: none;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #000000;
      font-size: 15px;
      transition: 0.3s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
    }

    button {
      grid-column: span 2;
      padding: 15px;
      background: linear-gradient(to right, #30CFD0, #f177a8);
      color: white;
      border: none;
      font-weight: bold;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(48, 207, 208, 0.4);
    }

    #portfolio {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .project-card {
      background: linear-gradient(to right, #30CFD0, #c281a7);
      border-radius: 15px;
      padding: 20px;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(8px);
      animation: slideUp 0.5s ease forwards;
    }

    .project-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .project-card h3 {
      margin-bottom: 10px;
      color: #ffffff;
      font-size: 20px;
    }

    .project-card p {
      color: #dddddd;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .project-card a {
      text-decoration: none;
      color: #490629b5;
      font-weight: bold;
      display: inline-block;
      margin-top: 5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }

      button {
        grid-column: span 1;
      }

      form textarea {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💼 Dynamic Portfolio Builder</h1>
    <form id="projectForm">
      <input type="text" id="title" placeholder="Project Title" required>
      <input type="url" id="link" placeholder="Project Link" required>
      <textarea id="description" placeholder="Project Description" rows="4" required></textarea>
      <button type="submit">➕ Add Project</button>
    </form>

    <div id="portfolio"></div>
  </div>

  <script>
    const form = document.getElementById('projectForm');
    const portfolio = document.getElementById('portfolio');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const link = document.getElementById('link').value.trim();

      if (!title || !description || !link) return;

      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <h3>${title}</h3>
        <p>${description}</p>
        <a href="${link}" target="_blank">🔗 Visit Project</a>
      `;

      portfolio.appendChild(card);
      form.reset();
    });
  </script>
</body>
</html>
