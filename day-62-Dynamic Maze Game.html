<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Maze Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      color: #f9d342;
    }

    #maze {
      display: grid;
      grid-template-columns: repeat(10, 40px);
      grid-template-rows: repeat(10, 40px);
      gap: 2px;
      border: 4px solid #f9d342;
      padding: 5px;
      background: #444;
    }

    .cell {
      width: 40px;
      height: 40px;
      background: #e0e0e0;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    .wall {
      background: #1b1b1b;
    }

    .player {
      background: #4caf50;
      box-shadow: 0 0 10px 2px rgba(76, 175, 80, 0.7);
    }

    .goal {
      background: #f9d342;
      box-shadow: 0 0 10px 2px rgba(249, 211, 66, 0.8);
    }

    .instructions {
      margin-top: 20px;
      font-size: 1rem;
      text-align: center;
    }

    .button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #f9d342;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      transition: background 0.3s;
    }

    .button:hover {
      background: #ffe373;
    }
  </style>
</head>
<body>
  <h1>Dynamic Maze Game</h1>
  <div id="maze"></div>
  <div class="instructions">
    Use Arrow Keys to Move <br>
    Reach the <span style="color: gold; font-weight: bold">Goal!</span>
  </div>
  <button class="button" onclick="resetGame()">Reset Game</button>

  <script>
    const levels = [
      {
        layout: [
          "1111111111",
          "1000000001",
          "1011111101",
          "1010000101",
          "1010110101",
          "1010100101",
          "1010111101",
          "1000000001",
          "1011111101",
          "1111111111"
        ],
        player: { x: 1, y: 1 },
        goal: { x: 8, y: 7 }
      },
      {
        layout: [
          "1111111111",
          "1001000001",
          "1011011101",
          "1000010001",
          "1111010111",
          "1000000001",
          "1011111101",
          "1010000101",
          "1010100101",
          "1111111111"
        ],
        player: { x: 1, y: 1 },
        goal: { x: 8, y: 5 }
      },
      {
        layout: [
          "1111111111",
          "1000000001",
          "1110111101",
          "1000100001",
          "1010110111",
          "1010000101",
          "1010110101",
          "1000000001",
          "1011111111",
          "1111111111"
        ],
        player: { x: 1, y: 1 },
        goal: { x: 8, y: 7 }
      }
    ];

    let currentLevel = 0;
    let mazeLayout, playerPos, goalPos;

    const maze = document.getElementById('maze');

    function loadLevel(index) {
      const level = levels[index];
      mazeLayout = level.layout;
      playerPos = { ...level.player };
      goalPos = { ...level.goal };
      drawMaze();
    }

    function drawMaze() {
      maze.innerHTML = '';
      for (let y = 0; y < 10; y++) {
        for (let x = 0; x < 10; x++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          if (mazeLayout[y][x] === '1') cell.classList.add('wall');
          if (x === playerPos.x && y === playerPos.y) cell.classList.add('player');
          if (x === goalPos.x && y === goalPos.y) cell.classList.add('goal');
          maze.appendChild(cell);
        }
      }
    }

    function movePlayer(dx, dy) {
      const newX = playerPos.x + dx;
      const newY = playerPos.y + dy;
      if (mazeLayout[newY][newX] === '0') {
        playerPos.x = newX;
        playerPos.y = newY;
        drawMaze();
        if (playerPos.x === goalPos.x && playerPos.y === goalPos.y) {
          setTimeout(() => {
            alert(`🎉 Level ${currentLevel + 1} complete!`);
            currentLevel++;
            if (currentLevel < levels.length) {
              loadLevel(currentLevel);
            } else {
              alert("🏆 You've completed all levels!");
              currentLevel = 0;
              loadLevel(currentLevel);
            }
          }, 100);
        }
      }
    }

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
      }
    });

    function resetGame() {
      currentLevel = 0;
      loadLevel(currentLevel);
    }

    loadLevel(currentLevel);
  </script>
</body>
</html>
