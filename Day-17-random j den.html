<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
      
            height: 100vh;
            background: #f5f5f5;
            flex-direction: column;
             background: linear-gradient(135deg, #FFB6C1, #FF69B4);
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 370px;
        }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #c2185b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>😂 Random Joke Generator 😂</h2>
        <p id="joke">Click the button for a joke!</p>
        <button onclick="getJoke()">New Joke</button>
        <button onclick="showPreviousJoke()">Previous Joke</button>
    </div>
    
    <script>
        let jokeHistory = [];
        let currentJokeIndex = -1;
        
        async function getJoke() {
            const response = await fetch('https://official-joke-api.appspot.com/random_joke');
            const data = await response.json();
            const newJoke = `${data.setup} - ${data.punchline}`;
            
            if (currentJokeIndex === -1 || newJoke !== jokeHistory[currentJokeIndex]) {
                jokeHistory.push(newJoke);
                currentJokeIndex++;
            }
            
            document.getElementById('joke').innerText = newJoke;
        }

        function showPreviousJoke() {
            if (currentJokeIndex > 0) {
                currentJokeIndex--;
                document.getElementById('joke').innerText = jokeHistory[currentJokeIndex];
            }
        }
    </script>
</body>
</html>
