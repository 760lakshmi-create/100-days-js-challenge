<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            flex-direction: column;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        input {
            padding: 10px;
            width: 200px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        button:hover {
            background: #c2185b;
        }
        .result {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Palindrome Checker</h2>
        <input type="text" id="textInput" placeholder="Enter a word or phrase">
        <br>
        <button onclick="checkPalindrome()">Check</button>
        <p class="result" id="result"></p>
    </div>

    <script>
        function checkPalindrome() {
            let text = document.getElementById("textInput").value;
            let cleanText = text.toLowerCase().replace(/[^a-z0-9]/g, "");
            let reversedText = cleanText.split('').reverse().join('');
            
            if (cleanText === reversedText) {
                document.getElementById("result").textContent = "✅ Yes, it's a palindrome!";
            } else {
                document.getElementById("result").textContent = "❌ No, it's not a palindrome.";
            }
        }
    </script>
</body>
</html>
