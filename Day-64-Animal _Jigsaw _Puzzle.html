<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jigsaw Puzzle Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 30px;
      color: #f9d342;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }

    #puzzle-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    #reference-image,
    #puzzle-board {
      width: 320px;
      height: 320px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }

    #reference-image {
      border: 4px solid #fff;
      object-fit: cover;
    }

    #puzzle-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 4px;
      background: #dcdde1;
      border: 4px solid #f9d342;
    }

    .piece {
      width: 100%;
      height: 100%;
      background-size: 320px 320px;
      border-radius: 6px;
      transition: transform 0.2s ease;
      cursor: grab;
    }

    .piece:hover {
      transform: scale(1.06);
    }

    .drop-zone {
      background: #bdc3c7;
    }

    #message {
      margin-top: 20px;
      font-size: 1.4rem;
      background: #27ae60;
      padding: 12px 24px;
      border-radius: 10px;
      display: none;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    button {
      margin-top: 30px;
      padding: 12px 28px;
      background: #f9d342;
      color: #2c3e50;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ffe373;
      transform: translateY(-2px);
    }

    @media (max-width: 700px) {
      #puzzle-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <h1>🧩 Animal Jigsaw Puzzle</h1>
  <div id="puzzle-container">
    <img id="reference-image" src="pug-cute-dogs.jpg" alt="Puzzle Reference Image">
    <div id="puzzle-board"></div>
  </div>
  <div id="message"></div>
  <button onclick="createPuzzle()">🔄 Shuffle</button>

  <script>
    const board = document.getElementById("puzzle-board");
    const message = document.getElementById("message");
    const size = 4;
    const totalPieces = size * size;
    const animalImage = "pug-cute-dogs.jpg";
    let positions = [];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function createPuzzle() {
      message.style.display = 'none';
      message.textContent = "";
      positions = Array.from({ length: totalPieces }, (_, i) => i);
      shuffle(positions);

      board.innerHTML = "";

      positions.forEach((pos, index) => {
        const div = document.createElement("div");
        div.className = "piece drop-zone";
        div.style.backgroundImage = `url('${animalImage}')`;
        const x = pos % size;
        const y = Math.floor(pos / size);
        div.style.backgroundPosition = `-${x * 80}px -${y * 80}px`;
        div.draggable = true;
        div.dataset.index = index;
        div.dataset.piece = pos;

        div.addEventListener("dragstart", dragStart);
        div.addEventListener("dragover", dragOver);
        div.addEventListener("drop", drop);

        board.appendChild(div);
      });
    }

    let draggedPiece = null;

    function dragStart(e) {
      draggedPiece = e.target;
    }

    function dragOver(e) {
      e.preventDefault();
    }

    function drop(e) {
      e.preventDefault();
      if (!draggedPiece || draggedPiece === e.target) return;

      const fromIndex = draggedPiece.dataset.index;
      const toIndex = e.target.dataset.index;

      const temp = draggedPiece.style.backgroundPosition;
      draggedPiece.style.backgroundPosition = e.target.style.backgroundPosition;
      e.target.style.backgroundPosition = temp;

      const tempPiece = draggedPiece.dataset.piece;
      draggedPiece.dataset.piece = e.target.dataset.piece;
      e.target.dataset.piece = tempPiece;

      checkWin();
    }

    function checkWin() {
      const pieces = document.querySelectorAll(".piece");
      for (let i = 0; i < totalPieces; i++) {
        if (parseInt(pieces[i].dataset.piece) !== i) {
          return;
        }
      }
      message.style.display = 'block';
      message.textContent = "🎉 Puzzle Solved!";
    }

    createPuzzle();
  </script>
</body>
</html>
