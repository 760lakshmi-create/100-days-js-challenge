<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #87CEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h2 {
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 80%;
            max-width: 800px;
        }
        .add-note {
            background: white;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        .note {
            background: white;
            width: 250px;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            position: relative;
        }
        .note-toolbar {
            display: flex;
            justify-content: space-between;
            padding: 5px;
        }
        .note-toolbar button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            margin-right: 5px;
        }
        .delete-btn {
            color: red;
        }
        .note-content {
            width: 100%;
            height: 100px;
            border: none;
            font-size: 16px;
            outline: none;
            resize: none;
        }
    </style>
</head>
<body>
    <h2>Sticky Notes App</h2>
    <div class="container">
        <div class="add-note" onclick="addNote()">+</div>
    </div>
    <script>
        function addNote() {
            let container = document.querySelector(".container");
            let note = document.createElement("div");
            note.classList.add("note");
            
            let toolbar = document.createElement("div");
            toolbar.classList.add("note-toolbar");
            
            let boldBtn = document.createElement("button");
            boldBtn.innerHTML = "<b>B</b>";
            boldBtn.onclick = function() {
                document.execCommand("bold");
            };
            
            let italicBtn = document.createElement("button");
            italicBtn.innerHTML = "<i>I</i>";
            italicBtn.onclick = function() {
                document.execCommand("italic");
            };
            
            let underlineBtn = document.createElement("button");
            underlineBtn.innerHTML = "<u>U</u>";
            underlineBtn.onclick = function() {
                document.execCommand("underline");
            };
            
            let deleteBtn = document.createElement("button");
            deleteBtn.innerHTML = "🗑";
            deleteBtn.classList.add("delete-btn");
            deleteBtn.onclick = function() {
                note.remove();
            };
            
            toolbar.appendChild(boldBtn);
            toolbar.appendChild(italicBtn);
            toolbar.appendChild(underlineBtn);
            toolbar.appendChild(deleteBtn);
            
            let content = document.createElement("div");
            content.classList.add("note-content");
            content.contentEditable = true;
            
            note.appendChild(toolbar);
            note.appendChild(content);
            container.appendChild(note);
        }
    </script>
</body>
</html>
