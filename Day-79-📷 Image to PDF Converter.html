<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image to PDF Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #F7F4EF, #CFC8BB, #7A7A7A);
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      min-height: 100vh;
background-repeat: no-repeat;
background-attachment: fixed;
    }
    h1 {
      font-weight: 600;
      color: #333;
      margin-bottom: 30px;
    }
    .custom-file-upload {
      display: inline-block;
      padding: 12px 20px;
      cursor: pointer;
      background: #2874A6;
      color: white;
      border-radius: 8px;
      font-weight: 500;
      margin-bottom: 30px;
      transition: background 0.3s;
    }
    .custom-file-upload:hover { background: #0056b3; }
    #fileInput { display: none; }
    .image-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }
    .image-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 300px;
    }
    .image-card img {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .button-group button {
      background:  #f4dfc6;
      color: rgb(14, 13, 13);
      border: none;
      padding: 12px 16px;
      margin: 5px 4px;
      border-radius: 36px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }
    .button-group button:hover { background: #f1d381d6; }
    #downloadAllBtn {
      margin-top: 40px;
      padding: 12px 24px;
      background: #562637;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }
    #downloadAllBtn:hover { background: #AF7B85; }
    #cropModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #cropModal img {
      max-width: 90vw;
      max-height: 80vh;
    }
    #cropControls {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>📷 Image to PDF Converter</h1>
  <label class="custom-file-upload">
    📂 Choose Images
    <input type="file" id="fileInput" multiple accept="image/*">
  </label>
  <div class="image-container" id="previewContainer"></div>
  <button id="downloadAllBtn" style="display:none;">📄 Download All as PDF</button>

  <div id="cropModal">
    <div>
      <img id="cropImage" />
      <div id="cropControls">
        <button onclick="saveCrop()">✅ Save Crop</button>
        <button onclick="closeCrop()">❌ Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const fileInput = document.getElementById("fileInput");
    const previewContainer = document.getElementById("previewContainer");
    const downloadAllBtn = document.getElementById("downloadAllBtn");
    const cropModal = document.getElementById("cropModal");
    const cropImage = document.getElementById("cropImage");
    let cropper;

    let imageList = [];

    fileInput.addEventListener("change", function (e) {
      const files = Array.from(e.target.files);

      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = function (event) {
          const card = document.createElement("div");
          card.className = "image-card";

          const img = document.createElement("img");
          img.src = event.target.result;

          const buttonGroup = document.createElement("div");
          buttonGroup.className = "button-group";

          const rotateBtn = document.createElement("button");
          rotateBtn.innerText = "🔄 Rotate";
          let angle = 0;
          rotateBtn.onclick = () => {
            angle = (angle + 90) % 360;
            img.style.transform = `rotate(${angle}deg)`;
          };

          const cropBtn = document.createElement("button");
          cropBtn.innerText = "✂️ Crop";
          cropBtn.onclick = () => openCrop(img);

          const downloadBtn = document.createElement("button");
          downloadBtn.innerText = "⬇️ Download PDF";
          downloadBtn.onclick = () => downloadAsPDF(img);

          buttonGroup.appendChild(rotateBtn);
          buttonGroup.appendChild(cropBtn);
          buttonGroup.appendChild(downloadBtn);

          card.appendChild(img);
          card.appendChild(buttonGroup);
          previewContainer.appendChild(card);

          imageList.push(img);
          downloadAllBtn.style.display = "inline-block";
        };
        reader.readAsDataURL(file);
      });
    });

    function downloadAsPDF(img) {
      const tempDiv = document.createElement("div");
      tempDiv.appendChild(img.cloneNode());
      html2pdf().set({
        margin: 10,
        filename: "image.pdf",
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(tempDiv).save();
    }

    downloadAllBtn.addEventListener("click", () => {
      const tempDiv = document.createElement("div");
      imageList.forEach(img => {
        const clone = img.cloneNode();
        clone.style.marginBottom = "20px";
        tempDiv.appendChild(clone);
      });
      html2pdf().set({
        margin: 10,
        filename: "All_Images.pdf",
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(tempDiv).save();
    });

    function openCrop(img) {
      cropImage.src = img.src;
      cropModal.style.display = "flex";

      if (cropper) cropper.destroy();

      cropper = new Cropper(cropImage, {
        viewMode: 1,
        autoCropArea: 1,
        responsive: true,
        movable: true,
        zoomable: true,
        rotatable: true,
        scalable: true
      });

      cropImage.dataset.targetImg = img;
    }

    function saveCrop() {
      const canvas = cropper.getCroppedCanvas();
      const targetImg = [...previewContainer.getElementsByTagName("img")].find(i => i.src === cropImage.src);
      if (canvas && targetImg) {
        targetImg.src = canvas.toDataURL();
        cropper.destroy();
        cropModal.style.display = "none";
      }
    }

    function closeCrop() {
      if (cropper) cropper.destroy();
      cropModal.style.display = "none";
    }
  </script>
</body>
</html>
