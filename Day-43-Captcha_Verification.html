<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: rgb(244, 185, 185);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .captcha-box {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 3px;
            background: #333;
            color: rgb(255, 255, 255);
            padding: 10px;
            display: inline-block;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #218838;
        }
        .refresh {
            background: #dc3545;
            margin-left: 10px;
        }
        .refresh:hover {
            background: #c82333;
        }
        .message {
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Captcha Verification</h2>
        <div class="captcha-box" id="captcha"></div>
        <input type="text" id="captchaInput" placeholder="Enter captcha here">
        <div>
            <button onclick="verifyCaptcha()">Verify</button>
            <button class="refresh" onclick="generateCaptcha()">Refresh</button>
        </div>
        <div class="message" id="message"></div>
    </div>
    
    <script>
        function generateCaptcha() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            document.getElementById('captcha').textContent = captcha;
            document.getElementById('message').textContent = '';
        }
        
        function verifyCaptcha() {
            const enteredCaptcha = document.getElementById('captchaInput').value;
            const generatedCaptcha = document.getElementById('captcha').textContent;
            const message = document.getElementById('message');
            
            if (enteredCaptcha === generatedCaptcha) {
                message.style.color = 'green';
                message.textContent = '✅ Captcha Verified!';
            } else {
                message.style.color = 'red';
                message.textContent = '❌ Incorrect Captcha. Try again!';
            }
        }
        
        // Generate initial captcha on load
        window.onload = generateCaptcha;
    </script>
</body>
</html>
