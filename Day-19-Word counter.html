<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1e1e1e;
            margin: 0;
            color: white;
        }
        .container {
            width: 90%;
            max-width: 500px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            color: #ff6f61;
        }
        textarea {
            width: 94%;
            height: 150px;
            padding: 10px;
            border: none;
            outline: none;
            border-radius: 5px;
            font-size: 16px;
            background: #333;
            color: white;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .stats div {
            background: #444;
            padding: 10px;
            border-radius: 5px;
            flex: 1;
            margin: 5px;
            text-align: center;
        }
        .clear-btn {
            margin-top: 15px;
            padding: 10px;
            border: none;
            background: #ff6f61;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        .clear-btn:hover {
            background: #e05a4f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Word Counter</h2>
        <textarea id="textInput" placeholder="Type something..." oninput="countWords()"></textarea>
        <div class="stats">
            <div><strong>Words:</strong> <span id="wordCount">0</span></div>
            <div><strong>Characters:</strong> <span id="charCount">0</span></div>
        </div>
        <button class="clear-btn" onclick="clearText()">Clear</button>
    </div>

    <script>
        function countWords() {
            let text = document.getElementById("textInput").value;
            let words = text.trim().split(/\s+/).filter(word => word !== "").length;
            let chars = text.length;
            document.getElementById("wordCount").innerText = words;
            document.getElementById("charCount").innerText = chars;
        }

        function clearText() {
            document.getElementById("textInput").value = "";
            document.getElementById("wordCount").innerText = "0";
            document.getElementById("charCount").innerText = "0";
        }
    </script>
</body>
</html>
