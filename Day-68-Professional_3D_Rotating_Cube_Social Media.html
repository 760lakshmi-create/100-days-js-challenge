<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Professional 3D Rotating Cube Social Media</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap');

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121212;
      font-family: 'Roboto', sans-serif;
      perspective: 1200px;
      color: #eee;
      user-select: none;
    }

    .scene {
      width: 250px;
      height: 250px;
      perspective: 1000px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spin 20s linear infinite;
      cursor: pointer;
      transition: transform 0.5s ease;
      border-radius: 16px;
    }

    .cube:hover {
      animation-play-state: paused;
      transform: rotateX(20deg) rotateY(20deg);
    }

    .face {
      position: absolute;
      width: 250px;
      height: 250px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 500;
      font-size: 20px;
      color: #ddd;
      text-shadow: 0 0 6px rgba(0,0,0,0.6);
      transition: background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
      user-select: none;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
    }

    .face img {
      width: 80px;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
      transition: transform 0.3s ease, filter 0.3s ease;
      pointer-events: none;
      user-select: none;
    }

    .face:hover, .face:focus {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    .face:hover img, .face:focus img {
      transform: scale(1.15);
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.7));
    }

    /* Highlight selected face */
    .face.selected {
      box-shadow: 0 0 15px 3px #00bfff;
      background: rgba(0, 191, 255, 0.15);
      color: #00bfff;
    }

    /* Position each face */
    .face.front  { transform: rotateY(0deg) translateZ(125px); }
    .face.back   { transform: rotateY(180deg) translateZ(125px); }
    .face.right  { transform: rotateY(90deg) translateZ(125px); }
    .face.left   { transform: rotateY(-90deg) translateZ(125px); }
    .face.top    { transform: rotateX(90deg) translateZ(125px); }
    .face.bottom { transform: rotateX(-90deg) translateZ(125px); }

    @keyframes spin {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(360deg); }
    }

    /* Display selected face name */
    #selected-name {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 600;
      font-family: 'Roboto', sans-serif;
      color: #00bfff;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0,191,255,0.6);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .scene {
        width: 180px;
        height: 180px;
      }
      .face {
        width: 180px;
        height: 180px;
        font-size: 16px;
      }
      .face img {
        width: 60px;
      }
    }
  </style>
</head>
<body>
  <div id="selected-name">Select a face</div>
  <div class="scene" aria-label="Social Media Rotating Cube">
    <div class="cube" role="list" tabindex="0">
      <div class="face front" role="listitem" tabindex="0" aria-label="Facebook" data-name="Facebook" data-url="https://www.facebook.com">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook Logo" />
        Facebook
      </div>
      <div class="face back" role="listitem" tabindex="0" aria-label="WhatsApp" data-name="WhatsApp" data-url="https://www.whatsapp.com">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp Logo" />
        WhatsApp
      </div>
      <div class="face right" role="listitem" tabindex="0" aria-label="Instagram" data-name="Instagram" data-url="https://www.instagram.com">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram Logo" />
        Instagram
      </div>
      <div class="face left" role="listitem" tabindex="0" aria-label="Twitter" data-name="Twitter" data-url="https://www.twitter.com">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter Logo" />
        Twitter
      </div>
      <div class="face top" role="listitem" tabindex="0" aria-label="LinkedIn" data-name="LinkedIn" data-url="https://www.linkedin.com">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn Logo" />
        LinkedIn
      </div>
      <div class="face bottom" role="listitem" tabindex="0" aria-label="YouTube" data-name="YouTube" data-url="https://www.youtube.com">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube Logo" />
        YouTube
      </div>
    </div>
  </div>

  <audio id="click-sound" src="https://actions.google.com/sounds/v1/ui/click.ogg" preload="auto"></audio>

  <script>
    const faces = document.querySelectorAll('.face');
    const selectedName = document.getElementById('selected-name');
    const clickSound = document.getElementById('click-sound');
    const cube = document.querySelector('.cube');
    let selectedFace = null;
    let animationPaused = false;

    // Select a face and highlight it, show name, play sound
    function selectFace(face, openLink = true) {
      if (selectedFace) selectedFace.classList.remove('selected');
      selectedFace = face;
      selectedFace.classList.add('selected');
      selectedName.textContent = face.dataset.name;

      clickSound.currentTime = 0;
      clickSound.play();

      if (openLink) {
        window.open(face.dataset.url, '_blank');
      }
    }

    // Add click and keyboard event listeners to each face
    faces.forEach(face => {
      face.addEventListener('click', () => {
        selectFace(face);
      });
      face.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectFace(face);
        }
      });
    });

    // Pause/resume cube rotation on cube click
    cube.addEventListener('click', () => {
      if (!animationPaused) {
        cube.style.animationPlayState = 'paused';
        animationPaused = true;
      } else {
        cube.style.animationPlayState = 'running';
        animationPaused = false;
      }
    });
  </script>
</body>
</html>
