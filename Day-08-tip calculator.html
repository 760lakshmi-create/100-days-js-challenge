<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        .calculator {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        h2 {
            margin-bottom: 15px;
        }
        input {
            width: 96%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        .total {
            font-weight: bold;
            margin: 15px 0;
            font-size: 18px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #e91e63;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Tip Calculator</h2>
        <label>Bill</label>
        <input type="number" id="bill" placeholder="Enter bill amount">
        <label>Tip Percentage</label>
        <input type="number" id="tipPercentage" placeholder="Enter tip %">
        <label>No. of Persons</label>
        <input type="number" id="people" placeholder="Enter number of people">
        <div class="total">Total: <span id="total">0</span> (per person)</div>
        <button onclick="calculateTip()">Calculate</button>
    </div>

    <script>
        function calculateTip() {
            let bill = parseFloat(document.getElementById('bill').value);
            let tipPercentage = parseFloat(document.getElementById('tipPercentage').value);
            let people = parseInt(document.getElementById('people').value);
            
            if (isNaN(bill) || isNaN(tipPercentage) || isNaN(people) || people <= 0) {
                alert("Please enter valid numbers");
                return;
            }
            
            let totalTip = (bill * (tipPercentage / 100)) / people;
            document.getElementById('total').innerText = totalTip.toFixed(2);
        }
    </script>
</body>
</html>
