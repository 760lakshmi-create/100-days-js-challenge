<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Centered Carousel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: 
        radial-gradient(ellipse at center, rgba(20,20,20,0.8) 0%, rgba(0, 0, 0, 0.677) 100%),
        url('8.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      backdrop-filter: blur(2px);
      perspective: 1200px;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .carousel {
      position: relative;
      width: 300px;
      height: 300px;
      transform-style: preserve-3d;
      animation: rotate 15s infinite linear;
    }

    .carousel img {
      position: absolute;
      width: 180px;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6), 0 0 10px rgba(255,255,255,0.1);
      transition: transform 0.5s;
    }

    .carousel img:nth-child(1) { transform: rotateY(0deg) translateZ(350px); }
    .carousel img:nth-child(2) { transform: rotateY(60deg) translateZ(350px); }
    .carousel img:nth-child(3) { transform: rotateY(120deg) translateZ(350px); }
    .carousel img:nth-child(4) { transform: rotateY(180deg) translateZ(350px); }
    .carousel img:nth-child(5) { transform: rotateY(240deg) translateZ(350px); }
    .carousel img:nth-child(6) { transform: rotateY(300deg) translateZ(350px); }

    @keyframes rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    .carousel:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body>

  <div class="carousel">
    <img src="1.jpg" alt="1">
    <img src="5.jpg" alt="2">
    <img src="7.jpg" alt="3">
    <img src="11.jpg" alt="4">
    <img src="10.jpg" alt="5">
    <img src="6.jpg" alt="6">
  </div>

</body>
</html>
