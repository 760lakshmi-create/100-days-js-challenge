<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Glow Cards Final Enhanced</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient( #0f2027, #203a43, #2c5364);
      background-size: 400% 400%;
      animation: bgShift 15s ease infinite;
      font-family: 'Inter', sans-serif;
      color: #fff;
      padding: 40px 20px;
      min-height: 100vh;
    }

    /* @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    } */

    .card-container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 100px;
      perspective: 1000px;
    }

    .card {
      position: relative;
      width: 280px;
      padding: 26px 26px 32px;
      background: linear-gradient(160deg, #2e2e2e, #1c1c1e);
      border-radius: 20px;
      border-top-right-radius:0px ;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      transform-style: preserve-3d;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      margin-right:50px;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0.08), transparent);
      transform: skewX(-20deg);
      animation: shine 4s infinite linear;
      z-index: 3;
      pointer-events: none;
    }

    @keyframes shine {
      0% { left: -75%; }
      100% { left: 125%; }
    }

    .tag-wrapper {
      perspective: 600px;
      transform-style: preserve-3d;
      position: absolute;
      top: 22px;
      left: 24px;
      z-index: 2;
    }

    .date-tag {
      background: #000;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      transform: translateZ(0px);
      transition: transform 0.4s ease, color 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .tag-wrapper:hover .date-tag {
      transform: translateZ(60px) translateY(-10px);
      color: #ffd78f;
    }

    .date-tag span {
      display: block;
      font-size: 11px;
      color: #aaa;
    }

    .date-tag strong {
      font-size: 15px;
      color: #fff;
    }

    .title-wrapper {
      perspective: 600px;
      transform-style: preserve-3d;
      display: inline-block;
    }

    .title-wrapper h2 {
      margin-top: 70px;
      font-size: 24px;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      transform: translateZ(0px);
      transition: transform 0.4s ease, color 0.3s ease;
      z-index: 2;
      position: relative;
      color: #fefefe;
      letter-spacing: 0.5px;
      will-change: transform;
    }

    .title-wrapper h2:hover {
      transform: translateZ(60px) translateY(-10px);
      color: #f4f3f3;
    }

    .card p {
      margin: 14px 0 26px;
      font-size: 15px;
      color: #cccccc;
      line-height: 1.6;
    }

    .see-more {
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      color: #fff;
      position: relative;
      padding-bottom: 2px;
    }

    .see-more::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 2px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s ease;
    }

    .see-more:hover::after {
      transform: scaleX(1);
    }

    .red-glow:hover {
      box-shadow: 0 0 45px 12px rgba(222, 77, 106, 0.849), 0 0 15px rgba(255, 100, 50, 0.3);
      transform: translate(-10px) rotate(12deg);
    }

    .green-glow:hover {
      box-shadow: 0 0 45px 12px rgba(0, 255, 180, 0.5), 0 0 15px rgba(0, 255, 180, 0.3);
      transform: translate(-10px) rotate(12deg);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- RED CARD -->
    <div class="card red-glow">
      <div class="tag-wrapper">
        <div class="date-tag">
          <span>JUNE</span><strong>29</strong>
        </div>
      </div>
      <div class="title-wrapper">
        <h2>Card Title</h2>
      </div>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Facere sequi illo nam repellendus tempore quaerat.
      </p>
      <a href="#" class="see-more">SEE MORE</a>
    </div>

    <!-- GREEN CARD -->
    <div class="card green-glow">
      <div class="tag-wrapper">
        <div class="date-tag">
          <span>JUNE</span><strong>29</strong>
        </div>
      </div>
      <div class="title-wrapper">
        <h2>Card Title</h2>
      </div>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Facere sequi illo nam repellendus tempore quaerat.
      </p>
      <a href="#" class="see-more">SEE MORE</a>
    </div>
  </div>

</body>
</html>
