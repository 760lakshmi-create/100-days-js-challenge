<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #343a40;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }
        h2 {
            margin-bottom: 20px;
        }
        input {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: right;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #212529;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        button:hover {
            background: #1d2124;
        }
        .results {
            margin-top: 20px;
            text-align: left;
        }
        .result-box {
            background: #e9ecef;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Loan Calculator</h2>
        <input type="number" id="amount" placeholder="$  Loan Amount" required>
        <input type="number" id="rate" placeholder="%  Interest Rate" required>
        <input type="number" id="years" placeholder="Loan Term (Years)" required>
        <button onclick="calculateLoan()">Calculate</button>
        <div class="results">
            <div class="result-box"><span>Total Payment</span><span id="totalPayment">0.00</span></div>
            <div class="result-box"><span>Monthly Payment</span><span id="monthlyPayment">0.00</span></div>
            <div class="result-box"><span>Total Interest</span><span id="totalInterest">0.00</span></div>
        </div>
    </div>
    <script>
        function calculateLoan() {
            let amount = parseFloat(document.getElementById('amount').value);
            let rate = parseFloat(document.getElementById('rate').value) / 100 / 12;
            let years = parseInt(document.getElementById('years').value);
            let months = years * 12;
            
            if (isNaN(amount) || isNaN(rate) || isNaN(years) || years <= 0) {
                alert("Please enter valid values.");
                return;
            }
            
            let monthlyPayment = (amount * rate) / (1 - Math.pow(1 + rate, -months));
            let totalPayment = monthlyPayment * months;
            let totalInterest = totalPayment - amount;
            
            document.getElementById('monthlyPayment').innerText = monthlyPayment.toFixed(2);
            document.getElementById('totalPayment').innerText = totalPayment.toFixed(2);
            document.getElementById('totalInterest').innerText = totalInterest.toFixed(2);
        }
    </script>
</body>
</html>
