<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎤 Smart Notes - Voice to Text</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-light: linear-gradient(135deg, #f9f9f9, #e0eaff);
      --bg-dark: linear-gradient(135deg, #1a1a2e, #16213e);
      --text-light: #222;
      --text-dark: #eee;
      --accent: #00bcd4;
      --card-bg-light: rgba(255, 255, 255, 0.75);
      --card-bg-dark: rgba(255, 255, 255, 0.05);
      --glass-blur: blur(14px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      transition: all 0.4s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 172, 255, 0.1), transparent 70%), radial-gradient(circle, rgba(255, 0, 200, 0.07), transparent 70%);
      animation: rotateBG 30s linear infinite;
      z-index: -1;
    }

    @keyframes rotateBG {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    .container {
      background: var(--card-bg-light);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      position: relative;
      transition: all 0.4s ease;
    }

    body.dark .container {
      background: var(--card-bg-dark);
    }

    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.2);
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      resize: none;
      font-family: 'Poppins', sans-serif;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.12);
      transition: box-shadow 0.3s ease;
    }

    textarea:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 172, 255, 0.4);
    }

    .listening {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .wave {
      display: flex;
      gap: 6px;
    }

    .wave span {
      display: block;
      width: 10px;
      height: 20px;
      background: var(--accent);
      animation: waveAnim 1.2s infinite ease-in-out;
      border-radius: 6px;
    }

    .wave span:nth-child(2) { animation-delay: 0.1s; }
    .wave span:nth-child(3) { animation-delay: 0.2s; }
    .wave span:nth-child(4) { animation-delay: 0.3s; }
    .wave span:nth-child(5) { animation-delay: 0.4s; }

    @keyframes waveAnim {
      0%, 100% { height: 12px; }
      50% { height: 32px; }
    }

    .saved-msg {
      font-size: 0.9rem;
      color: green;
      text-align: right;
      margin-top: 6px;
    }

    #viewNotes {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    #viewNotes:hover {
      background: var(--accent);
      color: white;
    }

    .saved-notes {
      margin-top: 20px;
      font-size: 0.95rem;
      color: var(--text-light);
      max-height: 200px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.5);
      display: none;
    }

    body.dark .saved-notes {
      background-color: rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 500px) {
      .container {
        padding: 25px 20px;
      }
      h1 {
        font-size: 2rem;
      }
      button {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">🌙</div>
  <div class="container">
    <h1>🎤 Smart Notes</h1>
    <textarea id="noteArea" placeholder="Speak or type your notes here..."></textarea>
    <div class="saved-msg" id="saveStatus"></div>
    <button id="saveBtn">💾 Save Note</button>
    <button id="startBtn">🎙️ Start Dictation</button>
    <button id="viewNotes">📒 View Saved Note</button>
    <div class="listening" id="listeningVisual" style="display: none;">
      <div class="wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="saved-notes" id="savedNotes"></div>
  </div>

  <script>
    const noteArea = document.getElementById("noteArea");
    const saveBtn = document.getElementById("saveBtn");
    const startBtn = document.getElementById("startBtn");
    const saveStatus = document.getElementById("saveStatus");
    const listeningVisual = document.getElementById("listeningVisual");
    const themeToggle = document.getElementById("themeToggle");
    const viewNotesBtn = document.getElementById("viewNotes");
    const savedNotesDiv = document.getElementById("savedNotes");

    // Load saved note & theme
    window.onload = () => {
      const savedNote = localStorage.getItem("smartNote");
      if (savedNote) noteArea.value = savedNote;

      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        themeToggle.textContent = "☀️";
      }
    };

    saveBtn.addEventListener("click", () => {
      localStorage.setItem("smartNote", noteArea.value);
      saveStatus.textContent = "✅ Note saved!";
      setTimeout(() => saveStatus.textContent = "", 2000);
    });

    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const darkMode = document.body.classList.contains("dark");
      themeToggle.textContent = darkMode ? "☀️" : "🌙";
      localStorage.setItem("theme", darkMode ? "dark" : "light");
    });

    viewNotesBtn.addEventListener("click", () => {
      const savedNote = localStorage.getItem("smartNote");
      savedNotesDiv.style.display = savedNotesDiv.style.display === "none" ? "block" : "none";
      savedNotesDiv.textContent = savedNote ? savedNote : "No saved note found.";
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      startBtn.addEventListener("click", () => {
        recognition.start();
        listeningVisual.style.display = "flex";
        startBtn.textContent = "🎙️ Listening...";
      });

      recognition.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map(result => result[0].transcript)
          .join("");
        noteArea.value = transcript;
      };

      recognition.onerror = (event) => {
        console.error("Error:", event.error);
        listeningVisual.style.display = "none";
        startBtn.textContent = "🎙️ Start Dictation";
      };

      recognition.onend = () => {
        listeningVisual.style.display = "none";
        startBtn.textContent = "🎙️ Start Dictation";
      };
    } else {
      startBtn.disabled = true;
      startBtn.textContent = "🚫 Voice not supported";
    }
  </script>
</body>
</html>
