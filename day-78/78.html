<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Double Profile Card Flip</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom right, #402e2a ,#947c70, #ede3db);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .wrapper {
      display: flex;
      gap: 40px;
    }

    .card-container {
      width: 280px;
      height: 380px;
      perspective: 1200px; margin: 30px;
    }

    .profile-card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.8s;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .profile-card.flipped {
      transform: rotateY(180deg);
    }

    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      backface-visibility: hidden;
      overflow: hidden;
      top: 0;
      left: 0;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      transition: transform 0.5s ease;
    }

    .card-front:hover img {
      transform: scale(1.19);
    }

    .overlay-box {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      bottom: 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.818);
      border-radius: 16px;
      opacity: 0;
      transition: all 0.4s ease;
      padding: 16px;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .card-front:hover .overlay-box {
      opacity: 1;
      pointer-events: auto;
    }

    .icons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .icons a {
      color: white;
      font-size: 20px;
      transition: transform 0.3s ease;
      text-decoration: none;
      position: relative;
    }

    .icons a:hover {
      transform: scale(1.2);
      color: #00acee;
    }

    .icons a::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      background: #fff;
      color: #000;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s ease;
    }

    .icons a:hover::after {
      opacity: 1;
    }

    .card-back {
      background: #1c1c1c;
      color: #fff;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .card-back h2 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #00acee;
    }

    .card-back h4 {
      font-size: 14px;
      margin-bottom: 15px;
      color: #ccc;
    }

    .card-back p {
      font-size: 13px;
      line-height: 1.4;
      color: #aaa;
    }

    .card-back .contact-btn {
      margin-top: 15px;
      padding: 8px 18px;
      background: #00acee;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .card-back .contact-btn:hover {
      background: #0077b5;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Card 1 -->
    <div class="card-container">
      <div class="profile-card" onclick="this.classList.toggle('flipped')">
        <div class="card-side card-front">
          <img src="employee-2.jpg" alt="Profile Image" />
          <div class="overlay-box">
            <div class="icons">
              <a href="https://www.instagram.com/" target="_blank" data-tooltip="Instagram"><i class="fab fa-instagram"></i></a>
              <a href="https://www.facebook.com/" target="_blank" data-tooltip="Facebook"><i class="fab fa-facebook"></i></a>
              <a href="https://www.linkedin.com/" target="_blank" data-tooltip="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
          </div>
        </div>
        <div class="card-side card-back">
          <h2>ADAM HENRY</h2>
          <h4>Creative Developer</h4>
          <p>A passionate front-end developer with a flair for creating stunning UI and engaging user experiences.</p>
          <button class="contact-btn">Contact</button>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card-container">
      <div class="profile-card" onclick="this.classList.toggle('flipped')">
        <div class="card-side card-front">
          <img src="employee-4.jpg" alt="Profile Image" />
          <div class="overlay-box">
            <div class="icons">
              <a href="https://www.instagram.com/" target="_blank" data-tooltip="Instagram"><i class="fab fa-instagram"></i></a>
              <a href="https://www.facebook.com/" target="_blank" data-tooltip="Facebook"><i class="fab fa-facebook"></i></a>
              <a href="https://www.linkedin.com/" target="_blank" data-tooltip="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
          </div>
        </div>
        <div class="card-side card-back">
          <h2>JULIA BROWN</h2>
          <h4>Creative Developer</h4>
          <p>A passionate front-end developer with a flair for creating stunning UI and engaging user experiences.</p>
          <button class="contact-btn">Contact</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
